[project]
name = "uscg-navigation-restriction-resolver"
version = "1.0.0"
description = "Apify Actor checking a point, route or area against current official USCG NAVCEN maritime safety information layers."
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "storage"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls the live NAVCEN service (run explicitly with -m live)"]
addopts = "-m 'not live'"
